    <p>该公司今日正式发布新一代多模态大模型，支持图像、文本与语音三种模态的联合输入，
       在多项公开评测中取得领先成绩。官方称，相较上一代产品，本次发布的模型在推理
       成本上下降约四成。</p>

    <p>该公司同时宣布，模型权重将以开放许可发布，开发者可在商业场景中免费使用。
