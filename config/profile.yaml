# ============================================================
# 个人偏好 / Personal preferences
# 决定选题倾向、日报篇幅、输出语言与视频标记规则
# Drives topic selection, digest length, output languages and the video flag.
# ============================================================

# 命中则加权，越靠前权重越高 / keywords that boost an item's score
focus_keywords:
  - 大模型
  - 多模态
  - 智能体
  - 具身智能
  - OpenVINO
  - 推理优化
  - 开源模型
  - LLM
  - agent
  - inference

# 命中则直接排除 / keywords that drop an item outright
exclude_keywords:
  - 招聘
  - 广告
  - 融资快讯

# 命中则倾向标记 need_video（最终由 LLM 打分 + 规则共同判定，GUI 可人工覆盖）
# Hints for the need_video flag; the final call combines LLM scoring with these
# rules and can always be overridden by hand in the GUI.
video_keywords:
  - 发布
  - 开源
  - 突破
  - 首个
  - 演示
  - release
  - launch

# 每期日报最多收录条数 / max entries per issue
digest_max_entries: 15

# 超出字数区间时最多回炉几次 / rewrite rounds for an out-of-range draft
# 摘要每条都跑，回炉一次成本就翻倍；文案单篇按需跑，多给一次机会划得来。
copy_max_rewrites: 2
summary_max_rewrites: 1

# 喂给模型的正文上限（字）/ how much body text each node sends
# 两个数不一样是刻意的：摘要每条都跑，上限乘以条目数；文案单篇按需跑，宽一点只影响这一次。
# 截短是有代价的——实测一篇 4069 字的技术稿，被切掉的尾部含采样参数和一条关键局限，
# 而那正是「必须说局限」要用的料（见 docs/issues/008）。
summary_body_chars: 3000
script_body_chars: 6000

# 删掉的两项（都是「配了没用」）/ removed because nothing ever read them:
#   languages            —— 全仓无人读取；语言是每次生成时的参数（--lang），不是全局偏好
#   summary_max_sentences —— summarize.py 全文不引用；句数约束实际写在
#                            config/prompts/summarize.md 的提示词里

# ------------------------------------------------------------
# 媒体抓取上限 / media caps per article
#
# 多存是为了攒素材：日报只用 1~3 张，但做长图、口播配图、视频封面时都要挑图，
# 而**重抓拿不回当初那些图**——站点会换图删图。存储成本远低于错过素材。
# 单篇需要更多时：dna add <链接> --max-images 20
# 按源单独设置写在 config/sources.yaml 的 max_images / max_videos。
# ------------------------------------------------------------
max_images_per_article: 100
max_videos_per_article: 10

# ------------------------------------------------------------
# 各任务的目标字数区间（中文字数）/ target length windows, in Chinese characters
#
# **字数是验收标准。** 生成后由程序数一遍，超出区间就带着「请删掉 N 字」
# 回炉重写（文案最多 2 次，摘要最多 1 次——摘要每条都跑，回炉一次成本就翻倍）。
#
# 为什么用字数而不是秒数验收：模型能数字数，数不了秒数。同一个字数在不同
# 中英比例的稿子上实测能差 50%（200 字：中英混排约 27 秒，纯中文约 44 秒），
# 拿一个浮动 50% 的量当验收标准，合格的稿子会被反复回炉，
# 而偏短的稿子只要秒数恰好落在窗口内就静静通过。
#
# 英文版按语速折算成**词数**（约为字数的 0.39 倍），不按字符——
# 一个英文词的口播时长约等于两个半汉字。
# ------------------------------------------------------------
summary_chars: [80, 100]        # 条目摘要
shortvideo_chars: [200, 300]    # 短视频文案（约 30~37 秒）
narration_chars: [400, 800]     # 口播文案（约 1~2 分钟）

# ------------------------------------------------------------
# 时长区间（秒）/ duration windows
#
# **只用于提示词的开场句（「写一条 25~35 秒的文案」）与产物记账**，不参与验收。
# 想改文案长度请改上面的字数区间——改这里只会改变提示词里那句话的措辞。
# ------------------------------------------------------------
video_duration_seconds: [25, 35]
narration_duration_seconds: [60, 120]
# 长文案的下限是**下限而不是目标**：原文短就写短，宁可 6 分钟也不注水凑 15 分钟
longform_duration_seconds: [300, 900]   # 长文案，约 2025~6075 字（按需生成，最贵）

# ------------------------------------------------------------
# 视频稿结尾的固定引导语 / the sign-off closing every video script
#
# 这是账号品牌，换栏目就改这里；提示词里只留「结尾用这句」的规则。
# ------------------------------------------------------------
cta_line: "关注我，下期分享 AI 行业最新进展"

# ------------------------------------------------------------
# 进阶旋钮 / advanced tuning
#
# 这一节**不出现在设置面板里**，只在这个文件里改——它们要懂后果才该动。
# 下面全部是注释状态：**不写就是用默认值**（默认值定义在
# src/dna/core/config.py 的 Tuning 模型上，这里不抄一份，抄了必然漂移）。
# 要改哪一项，把那一行取消注释再改值。
#
# 它们此前全都写死在代码里。按优先级 env > config > docs > code，
# 凡是影响「日报收录什么、一篇花多少钱、稿子多长」的值都必须能在这里调。
# ------------------------------------------------------------
# tuning:
#   # 选题打分（五个权重合计 1.0；改一个记得调别的，否则总分跑出 0~1）
#   weight_keyword: 0.35        # 命中关注词
#   weight_multi_source: 0.25   # 几家媒体都报了
#   weight_freshness: 0.20      # 新鲜度
#   weight_substance: 0.12      # 正文篇幅
#   weight_media: 0.08          # 有没有配图
#   source_saturation: 4        # 几家报道算满分
#   substance_saturation: 1500  # 正文多少字算满分
#   freshness_window_hours: 48  # 新鲜度衰减到零的小时数
#   video_scan_chars: 600       # 视频关键词只在正文前这么多字里扫
#   focus_scan_chars: 2000      # 关注关键词同上；窗口太小会让靠后的词命不中
#
#   # 判重：保守一点。漏合并读者看得见，错合并看不见。
#   hamming_threshold: 3
#   simhash_sample_chars: 500
#
#   # 长文案（最贵的产物，每节一次调用）
#   longform_min_body_chars: 800    # 正文不足这么长就直接拒绝，不发请求
#   longform_expansion_ratio: 1.2   # 目标字数 = 原文 × 此值
#   longform_min_sections: 4
#   longform_max_sections: 8        # 这就是单篇的费用上限
#
#   # 趋势综述：条目太少时不写，省一次调用
#   min_entries_for_trend: 4

# ------------------------------------------------------------
# 工作台里的「NEW」标识没有配置项 / the "NEW" badge has no setting
#
# NEW = **人工投递进来的**（界面粘的链接 / 飞书投的）且一条产物都没有（含失败的）。
# 它一直挂着，直到对这篇调过一次 LLM 为止。
#
# 曾经有过一个 new_badge_hours（24 小时），已删除：时间窗解决错了问题——
# 它让「昨天粘进来、今天还没处理」的链接第二天失去标识，而那恰恰是最需要标识的。
# 真正要区分的是来源：人工粘的是「我特意要处理的」，RSS 抓的是候选池。
# ------------------------------------------------------------
